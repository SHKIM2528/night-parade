<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#101719" />
  <title>NIGHT PARADE — The Scroll Wakes After Dark</title>
  <link rel="stylesheet" href="./src/styles/app.css" />
</head>
<body>
  <main class="experience" aria-label="Interactive Night Parade handscroll">
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <div class="build-tag" aria-hidden="true">GATE 01 · V06</div>

    <header class="hud hud--top">
      <div class="brand">
        <strong>NIGHT PARADE</strong>
        <span><b lang="ja">百鬼夜行</b><i>/</i>THE SCROLL WAKES AFTER DARK</span>
      </div>
      <div class="chapter">01 — THE GREEN MONKEY</div>
      <div class="seal" lang="ja">夜</div>
    </header>

    <footer class="hud hud--bottom">
      <div class="instruction">
        <strong>MOVE THE LANTERN</strong>
        <span>LIGHT: IMAGE <i>/</i> DARK: CREATURE</span>
      </div>
      <button id="enter" type="button">ENTER AFTER DARK <span aria-hidden="true">↗</span></button>
    </footer>

    <div class="cursor" id="cursor" aria-hidden="true"><span></span></div>
    <div class="loading" id="loading" role="status">AWAKENING THE SCROLL</div>
    <div class="fallback" id="fallback" hidden>
      <p>This scene requires WebGL 2.</p>
    </div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
